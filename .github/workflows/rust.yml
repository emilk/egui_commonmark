name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clippy
      run: cargo clippy -- -Dwarnings

    - name: Check all features pulldown
      run: cargo check --no-default-features --features pulldown_cmark,better_syntax_highlighting,macros,embedded_image

    - name: Cargo fmt
      run: cargo fmt --check -q

    - name: Test
      run: cargo test --features macros

  snapshots:
    name: Snapshot tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install a Vulkan software renderer
      run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

    - name: Run snapshot tests
      run: cargo test -p egui_commonmark --features macros --test tables
      env:
        WGPU_BACKEND: vulkan

    - name: Upload snapshot diffs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-diffs
        path: "**/tests/snapshots/**/*.diff.png"
